<li class="item flexrow" data-item-id="{{item._id}}">
  <img src="{{item.img}}" width="24" height="24"/>
  <h4>{{item.name}}</h4>
  <span>{{item.data.continent}}</span>
  <span>{{item.data.value}}</span>
  {{#if item.data.fortified}}<i class="fas fa-shield-alt"></i>{{/if}}
  <a class="item-edit"><i class="fas fa-edit"></i></a>
  <a class="item-delete"><i class="fas fa-trash"></i></a>
</li>
