<form class="{{cssClass}}" autocomplete="off">
  <header class="sheet-header">
    <img src="{{item.img}}" data-edit="img" height="64" width="64"/>
    <input name="name" type="text" value="{{item.name}}"/>
  </header>
  <div class="form-group"><label>{{localize "LW.Continent"}}</label><input name="data.continent" type="text" value="{{data.continent}}"/></div>
  <div class="form-group"><label>{{localize "LW.Value"}}</label><input name="data.value" type="number" value="{{data.value}}" data-dtype="Number"/></div>
  <div class="form-group"><label>{{localize "LW.Fortified"}}</label><input type="checkbox" name="data.fortified" {{checked data.fortified}}/></div>
</form>
